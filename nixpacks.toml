[phases.setup]
nixPkgs = ["python311", "nodejs_22"]

[phases.install]
cmds = [
  "npm install -g pnpm@9",
  "pnpm install --frozen-lockfile",
  "pip install -r requirements.txt",
]

[phases.build]
cmds = [
  "npm install -g pnpm@9",
  "pnpm install",
  "PORT=8080 BASE_PATH=/ pnpm --filter @workspace/club-operations run build",
  "cd django_backend && python manage.py collectstatic --noinput",
  "cd django_backend && python manage.py migrate"
]